name: LinkedIn – daily post

on:
  schedule:
    - cron: "35 3 * * *"   # 05:35 South Africa time; the agent waits and sends at 06:00
  workflow_dispatch:
    inputs:
      today_note:
        description: "What did you do today? (optional, added to your activity log)"
        required: false
        type: string
      mode:
        description: "Override publish mode for this run"
        required: false
        type: choice
        default: config
        options: [config, auto, review]
      dry_run:
        description: "Dry run (write the post, don't publish)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: linkedin-agent
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: marketing/agent/requirements.txt

      - run: pip install -r marketing/agent/requirements.txt

      - name: Research, write and publish
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ vars.LINKEDIN_PERSON_URN }}
          LINKEDIN_TOKEN_EXPIRES: ${{ vars.LINKEDIN_TOKEN_EXPIRES }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TODAY_NOTE: ${{ inputs.today_note }}
          PUBLISH_MODE_OVERRIDE: ${{ inputs.mode != 'config' && inputs.mode || '' }}
          DRY_RUN: ${{ inputs.dry_run }}
          NO_WAIT: ${{ github.event_name == 'workflow_dispatch' }}
          GMAIL_ADDRESS: ${{ vars.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python marketing/agent/run_daily.py

      - name: Save briefing and post history
        if: always()
        run: |
          git config user.name "linkedin-agent"
          git config user.email "linkedin-agent@users.noreply.github.com"
          git add marketing/history.jsonl marketing/briefings marketing/activity.md
          git diff --cached --quiet || git commit -m "LinkedIn agent: $(date -u +%F) briefing and post"
          git pull --rebase && git push
